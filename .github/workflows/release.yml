name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version, e.g. v0.10.1-beta.1 (manual runs upload artifacts only)'
        type: string
        required: true
      target:
        description: 'Manual build target; tag pushes always build all three'
        type: choice
        default: all
        options: [all, win7-amd64, kylin-v10-amd64, kylin-v10-arm64]

permissions:
  contents: read

concurrency:
  group: compatibility-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.deleted == false }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      app_version: ${{ steps.metadata.outputs.app_version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate version and resolve targets
        id: metadata
        env:
          RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          RELEASE_TARGET: ${{ github.event_name == 'push' && 'all' || inputs.target || 'all' }}
        run: python compat/win7/ci.py metadata --version "$RELEASE_VERSION" --target "$RELEASE_TARGET" --output "$GITHUB_OUTPUT"
      - name: Check compatibility build helpers
        run: python -m unittest discover -s compat/win7/tests -p 'test_*.py'

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      CGO_ENABLED: '0'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PYTHONUTF8: '1'
      TZ: Asia/Shanghai
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate
      - name: Cache verified download archives
        uses: actions/cache@v4
        with:
          path: |
            .cache/compat-ci/downloads
            .cache/win7/electron/*.zip
            .cache/win7/connectors/*.tar.gz
          key: compat-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compat/win7/sources.lock.json', 'compat/win7/ci-lock.json') }}
      - name: Install pinned NSIS compiler
        if: ${{ matrix.target == 'win7-amd64' }}
        shell: pwsh
        run: |
          choco upgrade nsis --version=3.13 --yes --no-progress --allow-downgrade
          $nsisRoot = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          $nsisRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Linux packaging tools
        if: ${{ startsWith(matrix.target, 'kylin-') }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fakeroot dpkg binutils
      - name: Build and validate package
        shell: bash
        env:
          COMPAT_TARGET: ${{ matrix.target }}
        run: python compat/win7/ci.py build --version "$RELEASE_VERSION" --target "$COMPAT_TARGET"
      - name: Upload package and verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.target }}
          path: dist/compat-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    if: ${{ github.event_name == 'push' }}
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: compat-*
          path: dist
          merge-multiple: true
      - name: Verify downloaded assets
        working-directory: dist
        run: sha256sum --check SHA256SUMS-*.txt
      - name: Attach all compatibility packages to the tag release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/*
